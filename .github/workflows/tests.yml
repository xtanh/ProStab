name: Inference checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
      - run: python -m pip install pip==23.3.2
      - run: python -m pip install torch==1.13.1+cpu --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -m 'not integration'
      - run: cd /tmp && prostab --help
