[build-system]
requires = ["setuptools==67.8.0", "wheel==0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prostab"
version = "0.1.0"
description = "Protein stability changes for single substitutions"
readme = "README.md"
requires-python = ">=3.7,<3.11"
dependencies = [
  "torch==1.13.1",
  "numpy==1.21.6",
  "fair-esm==2.0.0",
  "omegaconf==2.3.0",
  "hydra-core==1.3.2",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
train = [
  "pytorch-lightning==1.7.3", "torchmetrics==0.11.4",
  "pandas==1.3.5", "biopython==1.81", "lmdb==1.3.0",
  "joblib==1.3.2", "scipy==1.7.3", "scikit-learn==1.0.2",
  "pyrootutils==1.0.4", "python-dotenv==0.21.1", "rich==13.8.1",
  "tensorboard==2.11.2"
]
dev = ["pytest==7.4.4"]

[project.scripts]
prostab = "prostab.cli:main"

[tool.setuptools.packages.find]
include = ["prostab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires local model weights and substantial memory"]
